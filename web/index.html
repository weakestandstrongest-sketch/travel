<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5EFEB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="旅のしおり" />
    <title>旅のしおり</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <h1>旅のしおり</h1>
      <p>行きたい場所を入れると、回る順番と時間を組み立てます</p>
    </header>

    <main class="layout">
      <section class="col-input">
        <div class="card">
          <h2>旅の基本</h2>
          <div class="grid2">
            <label class="field">出発日<input type="date" id="startDate" required /></label>
            <div class="field">
              日数
              <div class="stepper">
                <button type="button" data-step="-1" aria-label="1日減らす">−</button>
                <output id="days">1</output>
                <button type="button" data-step="1" aria-label="1日増やす">＋</button>
              </div>
            </div>
            <label class="field">宿を出る<input type="time" id="dayStart" step="300" /></label>
            <label class="field">宿に戻る<input type="time" id="dayEnd" step="300" /></label>
          </div>
          <div class="field">
            移動
            <div class="seg" id="mode" role="radiogroup">
              <button type="button" role="radio" data-mode="transit">電車・バス</button>
              <button type="button" role="radio" data-mode="walk">徒歩</button>
              <button type="button" role="radio" data-mode="car">車</button>
            </div>
          </div>
          <div class="field">
            宿・出発地
            <div id="base"></div>
          </div>
        </div>

        <div class="card">
          <h2>行きたい場所 <small id="spotCount"></small></h2>
          <div id="spotSearch"></div>
          <div id="suggest"></div>
          <ul id="spots" class="spots"></ul>
          <div id="spotsEmpty" class="empty">
            <p>場所の名前で探して追加してください。<br />★をつけた場所は優先して入れます。</p>
            <button type="button" class="btn" id="loadSample">京都のサンプルで試す</button>
          </div>
        </div>

        <button type="button" id="planBtn" class="btn primary big">旅程をつくる</button>

        <details class="card settings">
          <summary>設定</summary>
          <label class="field">
            のりかえ の URL
            <input type="url" id="norikaeUrl" inputmode="url" autocapitalize="off" spellcheck="false" />
          </label>
          <label class="check"><input type="checkbox" id="useNorikae" /> 旅程をつくったら、のりかえで実際の電車を調べて時間を合わせる</label>
          <p class="note">のりかえ は GitHub Pages（*.github.io）で開いたときだけ呼び出せます。</p>
        </details>
      </section>

      <section class="col-result">
        <div id="map" class="map"></div>
        <div id="status" class="status" hidden></div>
        <div id="itinerary"></div>
        <div id="export" class="card export" hidden>
          <h2>ひび手帳に入れる</h2>
          <p class="note">観光と電車の移動を、ひび手帳の予定にできます。<br />保存したファイルを、ひび手帳の <b>設定 → .ics ファイルを読み込む</b> で選んでください。同じ旅程を2回読み込んでも重複しません。</p>
          <div class="row">
            <button type="button" class="btn primary" id="saveIcs">.ics を保存</button>
            <button type="button" class="btn" id="copyText">テキストをコピー</button>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
